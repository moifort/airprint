name: Tests

on:
  # main and v* tags are tested by docker-publish.yml, which calls this
  # workflow as the gate for the image: running here too doubled every run
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches python3 in debian:trixie-slim (Dockerfile)
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
